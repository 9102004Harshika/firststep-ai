name: Daily FirstStep AI Ingestion

on:
  schedule:
    # 00:30 UTC == 06:00 IST
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  ingest-and-classify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Trigger ingestion
        env:
          API_BASE_URL: ${{ secrets.FIRSTSTEP_API_BASE_URL }}
          ADMIN_API_KEY: ${{ secrets.FIRSTSTEP_ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE_URL}" ] || [ -z "${ADMIN_API_KEY}" ]; then
            echo "Missing FIRSTSTEP_API_BASE_URL or FIRSTSTEP_ADMIN_API_KEY secrets"
            exit 1
          fi

          # Wake Render Free cold starts before the long admin call.
          echo "Warming API..."
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 45 "${API_BASE_URL}/api/health" -o /tmp/health.json; then
              echo "Health OK"
              cat /tmp/health.json
              break
            fi
            echo "Warm attempt $i failed; retrying..."
            sleep 10
          done

          echo "Starting ingestion..."
          # Retry transient 503/502 from free-tier spin-up; ingestion itself can take several minutes.
          # HTTP 409 + status=locked means PipelineLock held — accepted by cron, not submission proof.
          ok_http=0
          for i in 1 2 3 4 5; do
            http_code=$(curl -sS -o ingestion.json -w "%{http_code}" --max-time 900 \
              -X POST "${API_BASE_URL}/api/admin/ingestion/run" \
              -H "x-admin-api-key: ${ADMIN_API_KEY}" \
              -H "Content-Type: application/json" || true)
            echo "Ingestion HTTP $http_code (attempt $i)"
            if [ "$http_code" = "200" ] || [ "$http_code" = "201" ] || [ "$http_code" = "409" ]; then
              ok_http=1
              break
            fi
            if [ "$http_code" = "401" ] || [ "$http_code" = "403" ]; then
              echo "Admin auth failed — check FIRSTSTEP_ADMIN_API_KEY matches Render ADMIN_API_KEY"
              cat ingestion.json || true
              exit 1
            fi
            sleep 15
          done
          cat ingestion.json || true
          if [ "$ok_http" != "1" ]; then
            echo "Ingestion request failed after retries"
            exit 1
          fi
          # Note: status=locked means another run holds PipelineLock (skipped).
          # Cron tolerates locked so overlap does not fail the schedule.
          # Submission evidence requires a completed ok run — see docs/OPERATIONAL_VERIFICATION.md
          python - <<'PY'
          import json, sys
          data = json.load(open('ingestion.json'))
          ok = data.get('ok')
          status = (data.get('data') or {}).get('status') or data.get('status')
          if not ok and status != 'locked':
              print('Ingestion failed', data)
              sys.exit(1)
          if status == 'locked':
              print('Ingestion outcome: locked (skipped — not sufficient as submission proof of a successful refresh)')
          else:
              print('Ingestion outcome:', status)
          PY

      - name: Trigger classification
        env:
          API_BASE_URL: ${{ secrets.FIRSTSTEP_API_BASE_URL }}
          ADMIN_API_KEY: ${{ secrets.FIRSTSTEP_ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          ok_http=0
          for i in 1 2 3 4 5; do
            http_code=$(curl -sS -o classification.json -w "%{http_code}" --max-time 900 \
              -X POST "${API_BASE_URL}/api/admin/classification/run" \
              -H "x-admin-api-key: ${ADMIN_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"limit":500}' || true)
            echo "Classification HTTP $http_code (attempt $i)"
            if [ "$http_code" = "200" ] || [ "$http_code" = "201" ] || [ "$http_code" = "409" ]; then
              ok_http=1
              break
            fi
            if [ "$http_code" = "401" ] || [ "$http_code" = "403" ]; then
              echo "Admin auth failed — check FIRSTSTEP_ADMIN_API_KEY matches Render ADMIN_API_KEY"
              cat classification.json || true
              exit 1
            fi
            sleep 15
          done
          cat classification.json || true
          if [ "$ok_http" != "1" ]; then
            echo "Classification request failed after retries"
            exit 1
          fi
          python - <<'PY'
          import json, sys
          data = json.load(open('classification.json'))
          ok = data.get('ok')
          status = (data.get('data') or {}).get('status') or data.get('status')
          if not ok and status != 'locked':
              print('Classification failed', data)
              sys.exit(1)
          if status == 'locked':
              print('Classification outcome: locked (skipped — not sufficient as submission proof)')
          else:
              print('Classification outcome:', status)
          PY
